# render.yaml — Render deployment config
# Docs: https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: hands-free-assistant
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set these in Render Dashboard → Environment:
      # RIME_API_KEY, QDRANT_URL, QDRANT_API_KEY,
      # QDRANT_COLLECTION, GROQ_API_KEY, HF_API_TOKEN
